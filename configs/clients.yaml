# Client profiles for Dispatch's three surfaces:
#   chat demo (/demo) · MCP (dispatch-mcp) · OpenAI/Anthropic HTTP (/v1/*)
#
# Mode:
#   execute     — Dispatch calls its own providers (Groq/OpenRouter free via discovery)
#   passthrough — Classify, map tier → YOUR upstream model, forward the request
#
# With discover_models: true, Dispatch fetches GET {upstream}/models (or the
# OpenRouter catalog) and auto-maps cheap/mid/hard. DISPATCH_MODEL_* overrides
# a tier. DISPATCH_PROFILE / DISPATCH_MODE override active profile / mode.

active_profile: demo

profiles:
  # Chat demo, MCP, and execute-mode /v1/chat/completions.
  demo:
    mode: execute
    protocol: openai
    upstream_base_url: ""
    upstream_api_key: ""
    discover_models: true
    free_only: true
    models: {cheap: "", mid: "", hard: ""}
    fallbacks: {cheap: [], mid: [], hard: []}

  # OpenAI-compatible passthrough (/v1/chat/completions → your upstream).
  default:
    mode: passthrough
    protocol: openai
    upstream_base_url: https://openrouter.ai/api/v1
    upstream_api_key: ""
    discover_models: true
    free_only: false
    models: {cheap: "", mid: "", hard: ""}
    fallbacks: {cheap: [], mid: [], hard: []}

  # Anthropic Messages passthrough (/v1/messages → Anthropic or gateway).
  anthropic:
    mode: passthrough
    protocol: anthropic
    upstream_base_url: https://api.anthropic.com
    upstream_api_key: ""
    discover_models: true
    free_only: false
    models: {cheap: "", mid: "", hard: ""}
    fallbacks: {cheap: [], mid: [], hard: []}
