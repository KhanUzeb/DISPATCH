[project]
name = "dispatch"
version = "0.1.0"
description = "Dispatch — semantic LLM router across multiple providers with cost/latency accounting"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",
]
dashboard = [
    "streamlit>=1.37.0",
    "pandas>=2.2.0",
    "langfuse>=2.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:langsmith.pytest_plugin"
