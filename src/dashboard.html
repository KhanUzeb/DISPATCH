<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatch Dashboard</title>
  <style>
    body { font-family: Inter, Arial, sans-serif; background: #0b1020; color: #e6edf3; margin: 0; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 12px 0; }
    .muted { color: #9fb0c3; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0 24px; }
    .card { background: #121a2b; border: 1px solid #223149; border-radius: 10px; padding: 14px; }
    .label { color: #9fb0c3; font-size: 12px; }
    .value { font-size: 22px; font-weight: 700; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; background: #121a2b; border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #223149; font-size: 13px; }
    th { color: #9fb0c3; }
    button { background: #2f81f7; color: white; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; margin-right: 8px; }
    button.secondary { background: #223149; }
    .tier-cheap { color: #3fb950; }
    .tier-mid { color: #d29922; }
    .tier-hard { color: #f85149; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Dispatch Dashboard</h1>
    <p class="muted">Live metrics from server memory (persisted to disk) with local browser backup.</p>
    <button id="refresh">Refresh</button>
    <button id="clearLocal" class="secondary">Clear browser cache</button>
    <div class="grid">
      <div class="card"><div class="label">Events</div><div id="events" class="value">0</div></div>
      <div class="card"><div class="label">Cache Hit Rate</div><div id="cacheHit" class="value">0%</div></div>
      <div class="card"><div class="label">Avg Total Latency</div><div id="latency" class="value">0 ms</div></div>
      <div class="card"><div class="label">Total Actual Cost</div><div id="cost" class="value">$0.0000</div></div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Request</th><th>Tier</th><th>Model</th><th>Provider</th><th>Cache</th><th>Latency</th><th>Cost</th><th>Error</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script>
    const STORAGE_KEY = 'dispatch.dashboard.events.v1';
    const MAX_LOCAL = 500;

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function saveLocal(events) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(events.slice(-MAX_LOCAL)));
      } catch (_) {
        // ignore quota errors
      }
    }

    function mergeEvents(serverEvents, localEvents) {
      const byId = new Map();
      for (const e of [...localEvents, ...serverEvents]) {
        const id = e.request_id || `${e.created_at_ms || 0}-${e.selected_model || ''}-${e.tier || ''}`;
        byId.set(id, e);
      }
      return Array.from(byId.values()).sort(
        (a, b) => (a.created_at_ms || 0) - (b.created_at_ms || 0)
      );
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function authHeaders() {
      const key = sessionStorage.getItem('dispatch.api_key') || '';
      return key ? { Authorization: `Bearer ${key}` } : {};
    }

    function render(events) {
      document.getElementById('events').textContent = events.length;
      const cacheRate = events.length ? (events.filter(e => e.cache_hit).length / events.length) * 100 : 0;
      document.getElementById('cacheHit').textContent = `${cacheRate.toFixed(1)}%`;
      const avgLatency = events.length ? events.reduce((s, e) => s + (e.total_latency_ms || 0), 0) / events.length : 0;
      document.getElementById('latency').textContent = `${avgLatency.toFixed(1)} ms`;
      const totalCost = events.reduce((s, e) => s + (e.actual_cost_usd || 0), 0);
      document.getElementById('cost').textContent = `$${totalCost.toFixed(4)}`;

      const rows = events.slice().reverse().map(e => {
        const tier = escapeHtml(e.tier || '');
        return `
        <tr>
          <td>${escapeHtml(e.request_id || '')}</td>
          <td class="tier-${tier}">${tier}</td>
          <td>${escapeHtml(e.selected_model || '')}</td>
          <td>${escapeHtml(e.selected_provider || '')}</td>
          <td>${e.cache_hit ? 'hit' : 'miss'}</td>
          <td>${(e.total_latency_ms || 0).toFixed(1)} ms</td>
          <td>$${(e.actual_cost_usd || 0).toFixed(5)}</td>
          <td>${escapeHtml(e.error_category || '')}</td>
        </tr>`;
      }).join('');
      document.getElementById('rows').innerHTML = rows;
    }

    async function load() {
      let serverEvents = [];
      try {
        let resp = await fetch('/metrics/recent?limit=500', { headers: authHeaders() });
        if (resp.status === 401) {
          const entered = window.prompt('ROUTER_API_KEY required — enter Bearer token');
          if (entered) {
            sessionStorage.setItem('dispatch.api_key', entered.trim());
            resp = await fetch('/metrics/recent?limit=500', { headers: authHeaders() });
          }
        }
        if (resp.ok) {
          const data = await resp.json();
          serverEvents = data.events || [];
        }
      } catch (_) {
        serverEvents = [];
      }
      const merged = mergeEvents(serverEvents, loadLocal());
      saveLocal(merged);
      render(merged);
    }

    document.getElementById('refresh').addEventListener('click', load);
    document.getElementById('clearLocal').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      load();
    });
    // Show cached events immediately, then one server fetch. Refresh is manual.
    render(loadLocal());
    load();
  </script>
</body>
</html>
